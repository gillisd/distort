# bootstrap.conf — configuration for gnulib's ./bootstrap.

gnulib_modules="
  argp
  basename-lgpl
  error
  fpurge
  getprogname
  manywarnings
  std-gnu23
  warnings
"

: ${GNULIB_URL=https://github.com/coreutils/gnulib.git}
gnulib_tool_option_extras="--lgpl --automake-subdir --makefile-name=gnulib.mk"
gnulib_extra_files=
checkout_only_file=
SKIP_PO=t

# ./bootstrap --clean: delete everything git ignores (build output,
# configure, Makefile.in, gnulib imports) plus the gnulib clone, then stop.
# A gnulib submodule is left alone; the next ./bootstrap re-clones otherwise.
bootstrap_option_hook()
{
  case $1 in
    --clean)
      git clean -fdX || exit
      if ! git config --file .gitmodules submodule.gnulib.path >/dev/null 2>&1
      then
        rm -rf gnulib
      fi
      exit 0;;
  esac
  return 1
}

bootstrap_print_option_usage_hook()
{
  cat <<EOF2
  --clean                  Remove all files ignored by git (build output,
                           configure, Makefile.in, gnulib imports) and the
                           gnulib clone, then exit.
EOF2
}
