# bootstrap.conf — configuration for gnulib's ./bootstrap.

gnulib_modules="
  argp
  basename-lgpl
  error
  manywarnings
  progname
  std-gnu23
  warnings
"

: ${GNULIB_URL=https://github.com/coreutils/gnulib.git}
gnulib_tool_option_extras="--automake-subdir --makefile-name=gnulib.mk"
gnulib_extra_files=
checkout_only_file=
SKIP_PO=t
